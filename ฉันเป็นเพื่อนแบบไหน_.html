<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฉันเป็นเพื่อนแบบไหน?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<style>
:root{--bg:#fff8f0;--card:#fff;--ink:#2b2433;--mut:#7a7185;--pri:#ff7a59;--pri2:#ffe3d9;--line:#eadfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1824;--card:#2a2333;--ink:#f4eef8;--mut:#a89fb3;--pri:#ff8f70;--pri2:#4a2f2c;--line:#3d3447}}
:root[data-theme="dark"]{--bg:#1d1824;--card:#2a2333;--ink:#f4eef8;--mut:#a89fb3;--pri:#ff8f70;--pri2:#4a2f2c;--line:#3d3447}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px}
h1{font-size:26px;margin:0 0 8px}h2{font-size:20px;margin:0 0 6px}
p{margin:0 0 12px}.mut{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:13px 22px;font-weight:600;width:100%}
.ghost{background:none;border:0;color:var(--mut);padding:8px 0}
.bar{height:8px;background:var(--pri2);border-radius:8px;overflow:hidden;margin:6px 0 20px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .25s}
.q{font-size:19px;font-weight:600;min-height:90px;margin:8px 0 16px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.opt:active,.opt.on{border-color:var(--pri);background:var(--pri2)}
.opt b{width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none;font-size:14px}
.emoji{font-size:54px;text-align:center}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:20px;padding:2px 12px;font-size:13px;font-weight:600;margin:0 6px 6px 0}
.row{margin:10px 0}.row .l{display:flex;justify-content:space-between;font-size:14px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;margin:0 6px 8px 0;text-align:left}
.chip.on{border-color:var(--pri);background:var(--pri2)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script>
var T=[
{k:"support",n:"เพื่อนสายซัพพอร์ต",s:"อยู่ข้างเธอ",e:"🤝",d:"คุณคือคนที่เพื่อนนึกถึงเป็นคนแรกเมื่อมีปัญหา พร้อมยื่นมือช่วยและอยู่ข้างเพื่อนแม้ในวันที่ยากที่สุด ทำให้เพื่อนรู้ว่าเขาไม่ต้องสู้เพียงลำพัง",tips:["พร้อมช่วยเหลือเสมอ","ให้กำลังใจในวันที่ล้ม","ไม่ปล่อยเพื่อนไว้คนเดียว"],g:"ระวังอย่าแบกปัญหาของเพื่อนจนลืมดูแลใจตัวเอง"},
{k:"joy",n:"เพื่อนสายสร้างความสุข",s:"อยู่ด้วยแล้วมีความสุข",e:"😄",d:"คุณคือผู้สร้างรอยยิ้มและบรรยากาศดี ๆ ในกลุ่ม ชวนทำกิจกรรมสนุก ๆ และทำให้เพื่อนผ่อนคลายเมื่อเครียด เพื่อนสบายใจทุกครั้งที่อยู่กับคุณ",tips:["ทำให้หัวเราะได้","สร้างบรรยากาศสนุก","ช่วยให้เพื่อนผ่อนคลาย"],g:"บางครั้งเพื่อนอาจต้องการให้คุณจริงจังและรับฟังด้วย"},
{k:"listen",n:"เพื่อนสายรับฟัง",s:"เล่าให้ฉันฟังได้",e:"👂",d:"คุณเป็นพื้นที่ปลอดภัยของเพื่อน ฟังจนจบโดยไม่รีบตัดสิน ใส่ใจความรู้สึกก่อนตอบ เพื่อนจึงกล้าเล่าเรื่องส่วนตัวให้คุณฟัง",tips:["ฟังด้วยใจ","ไม่ตัดสิน","เป็นที่ไว้ใจเรื่องส่วนตัว"],g:"ลองบอกความรู้สึกของตัวเองให้เพื่อนฟังบ้างเช่นกัน"},
{k:"advisor",n:"เพื่อนสายที่ปรึกษา",s:"ฉันจะช่วยเธอคิด",e:"🧭",d:"คุณช่วยเพื่อนมองปัญหาหลายมุม จัดลำดับความคิด และคิดถึงผลที่จะตามมา กล้าพูดความจริงเมื่อมันเป็นประโยชน์กับเพื่อน",tips:["ช่วยคิดหาทางออก","มองหลายมุม","พูดความจริงด้วยความหวังดี"],g:"บางวันเพื่อนแค่อยากให้ฟัง ไม่ได้อยากได้คำแนะนำ"},
{k:"push",n:"เพื่อนสายผลักดัน",s:"ฉันอยากเห็นเธอเติบโต",e:"🚀",d:"คุณคือกำลังใจที่ดันให้เพื่อนกล้าลองสิ่งใหม่ ลุกขึ้นสู้อีกครั้งเมื่อล้ม และดีใจจริง ๆ กับความสำเร็จของเพื่อน",tips:["ให้กำลังใจให้กล้าลอง","สนับสนุนให้ลองอีกครั้ง","ยินดีกับความสำเร็จเพื่อน"],g:"เคารพจังหวะชีวิตของเพื่อน บางครั้งเขาต้องการพักก่อน"},
{k:"loyal",n:"เพื่อนสายจริงใจ",s:"ไม่ทิ้งกัน",e:"💛",d:"คุณซื่อสัตย์และไม่ทิ้งเพื่อน อยู่ข้างกันทั้งวันดีและวันแย่ กล้าขอโทษ ให้อภัย และเตือนด้วยความหวังดี มิตรภาพกับคุณจึงยืนยาว",tips:["ไม่ทิ้งกันทั้งวันดีและแย่","ขอโทษและให้อภัยได้","เตือนด้วยความหวังดี"],g:"อย่าลืมวางขอบเขตให้ตัวเองในมิตรภาพด้วย"}
];
var Q=[
[0,"ฉันพร้อมช่วยเพื่อนเมื่อเขากำลังมีปัญหา"],[0,"เมื่อเพื่อนล้มเหลว ฉันพยายามให้กำลังใจเขา"],[0,"ฉันพร้อมอยู่ข้างเพื่อน แม้ในวันที่เขาเจอเรื่องยาก"],[0,"ถ้าเพื่อนต้องการความช่วยเหลือ ฉันพยายามช่วยเท่าที่ทำได้"],[0,"ฉันอยากให้เพื่อนรู้ว่าเขาไม่ต้องเผชิญปัญหาเพียงลำพัง"],
[1,"ฉันมักทำให้เพื่อนหัวเราะหรือยิ้มได้"],[1,"ฉันชอบสร้างบรรยากาศที่สนุกเมื่ออยู่กับเพื่อน"],[1,"เมื่อเพื่อนเครียด ฉันพยายามทำให้เขาผ่อนคลาย"],[1,"ฉันชอบชวนเพื่อนทำกิจกรรมหรือสิ่งสนุก ๆ ด้วยกัน"],[1,"เพื่อนมักรู้สึกสบายใจเมื่ออยู่กับฉัน"],
[2,"เมื่อเพื่อนมีเรื่องไม่สบายใจ ฉันพร้อมฟังเขา"],[2,"ฉันพยายามฟังเพื่อนให้จบก่อนที่จะพูดหรือให้คำแนะนำ"],[2,"ฉันไม่รีบตัดสินเพื่อนเมื่อเขาเล่าเรื่องส่วนตัวให้ฟัง"],[2,"เพื่อนสามารถพูดเรื่องส่วนตัวกับฉันได้"],[2,"ฉันพยายามเข้าใจความรู้สึกของเพื่อนก่อนตอบเขา"],
[3,"เมื่อเพื่อนมีปัญหา ฉันช่วยเขาคิดหาทางออก"],[3,"ฉันสามารถมองปัญหาจากหลายมุมก่อนให้คำแนะนำ"],[3,"ฉันกล้าพูดความจริงกับเพื่อนเมื่อคิดว่าสิ่งนั้นจะช่วยเขา"],[3,"ฉันช่วยเพื่อนคิดถึงผลที่จะตามมาก่อนตัดสินใจ"],[3,"เมื่อเพื่อนสับสน ฉันพร้อมช่วยเขาจัดลำดับความคิด"],
[4,"ฉันชอบให้กำลังใจเพื่อนเมื่อเขากำลังพยายามทำบางสิ่ง"],[4,"ฉันช่วยให้เพื่อนกล้าที่จะลองทำสิ่งใหม่ ๆ"],[4,"เมื่อเพื่อนล้มเหลว ฉันสนับสนุนให้เขาลองอีกครั้ง"],[4,"ฉันยินดีกับความสำเร็จและการเติบโตของเพื่อน"],[4,"ฉันอยากเห็นเพื่อนพัฒนาตัวเองให้ดีขึ้น"],
[5,"ฉันยังเป็นเพื่อนกับคนอื่นแม้เขาจะไม่ได้ให้อะไรตอบแทนฉัน"],[5,"ฉันกล้าขอโทษเมื่อฉันทำผิดกับเพื่อน"],[5,"ฉันสามารถให้อภัยเพื่อนเมื่อเขาทำผิดกับฉัน"],[5,"ฉันกล้าเตือนเพื่อนด้วยความหวังดีเมื่อเขากำลังทำสิ่งที่ไม่ถูกต้อง"],[5,"ฉันพร้อมอยู่ข้างเพื่อนทั้งในวันที่ดีและวันที่แย่"]
];
var L=["ไม่ตรงกับฉันเลย","ไม่ค่อยตรง","ปานกลาง","ค่อนข้างตรง","ตรงกับฉันมากที่สุด"];
var app=document.getElementById("app"),order,ans,i,want=-1;

function shuffle(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t}return a}

function intro(){
 app.innerHTML='<div class="card"><div class="emoji">🫶</div><h1>ฉันเป็นเพื่อนแบบไหน?</h1><p>แบบประเมินสั้น ๆ 30 ข้อ ตอบตามความรู้สึกจริงของคุณ ไม่มีถูกหรือผิด แล้วระบบจะบอกว่าคุณเป็นเพื่อนประเภทไหน พร้อมอธิบายจุดเด่น</p><p class="mut">1 = ไม่ตรงกับฉันเลย … 5 = ตรงกับฉันมากที่สุด</p><button class="btn" id="go">เริ่มทำแบบประเมิน</button></div>';
 document.getElementById("go").onclick=function(){order=shuffle(Q.map(function(_,x){return x}));ans=[];i=0;want=-1;ask()}
}

function ask(){
 var q=Q[order[i]],pct=Math.round(i/30*100),h='<div class="card"><div class="mut">ข้อ '+(i+1)+' / 30</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="q">'+q[1]+'</div>';
 for(var s=5;s>=1;s--)h+='<button class="opt'+(ans[i]===s?' on':'')+'" data-s="'+s+'"><b>'+s+'</b>'+L[s-1]+'</button>';
 h+='<button class="ghost'+(i?'':' hide')+'" id="bk">← ย้อนกลับ</button></div>';
 app.innerHTML=h;
 Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){ans[i]=+b.dataset.s;i++;i<30?ask():result()}});
 var bk=document.getElementById("bk");if(bk)bk.onclick=function(){i--;ask()}
}

function result(){
 var sc=[0,0,0,0,0,0];
 order.forEach(function(qi,x){sc[Q[qi][0]]+=ans[x]});
 var mx=Math.max.apply(null,sc),tops=[];
 sc.forEach(function(v,x){if(v===mx)tops.push(x)});
 var h='<div class="card">';
 if(tops.length>1)h+='<p class="mut">คะแนนสูงสุดเท่ากัน '+tops.length+' ประเภท คุณเป็นเพื่อนแบบผสมผสาน!</p>';
 tops.forEach(function(x){var t=T[x];
  h+='<div class="emoji">'+t.e+'</div><h1 style="text-align:center;margin-bottom:0">'+t.n+'</h1><p class="mut" style="text-align:center">“'+t.s+'”</p><p>'+t.d+'</p><div>'+t.tips.map(function(z){return '<span class="tag">'+z+'</span>'}).join("")+'</div><p class="mut">💡 '+t.g+'</p>';
 });
 h+='<h2 style="margin-top:20px">คะแนนของคุณ</h2>';
 T.map(function(t,x){return [t,sc[x]]}).sort(function(a,b){return b[1]-a[1]}).forEach(function(r){
  h+='<div class="row"><div class="l"><span>'+r[0].e+' '+r[0].n+'</span><b>'+r[1]+'/25</b></div><div class="bar" style="margin:4px 0"><i style="width:'+r[1]/25*100+'%"></i></div></div>'});
 h+='<h2 style="margin-top:24px">เพื่อนที่ฉันตามหา</h2><p class="mut">เลือก 1 ประเภทที่คุณอยากมีเป็นเพื่อนมากที่สุด</p><div id="want">';
 T.forEach(function(t,x){h+='<button class="chip" data-x="'+x+'">'+t.e+' '+t.n.replace("เพื่อน","")+'</button>'});
 h+='</div><div id="wout"></div><p class="mut" style="margin-top:16px">ลองแชร์กับเพื่อนในกลุ่มคนละ 1 นาที ว่าคุณเป็นเพื่อนประเภทนี้หรือไม่ อย่างไร?</p><button class="btn" id="re">ทำอีกครั้ง</button></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 var chips=app.querySelectorAll(".chip");
 Array.prototype.forEach.call(chips,function(c){c.onclick=function(){
  Array.prototype.forEach.call(chips,function(o){o.classList.remove("on")});c.classList.add("on");
  var t=T[+c.dataset.x];document.getElementById("wout").innerHTML='<p style="margin-top:8px"><b>'+t.e+' '+t.n+'</b> — “'+t.s+'”<br><span class="mut">'+t.d+'</span></p>'}});
 document.getElementById("re").onclick=intro;
}
intro();
</script>
</body>
</html>
