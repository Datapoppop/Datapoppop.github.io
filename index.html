  html.dark .glass-card {
    box-shadow: 0 24px 50px -15px rgba(0, 0, 0, 0.45);
  }

  @keyframes fadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(14px) scale(0.99);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

    animation: fadeSlideUp 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;

    60% { transform: scale(1.08); }

/**
 * ระบบจัดการ Dark / Light Theme
 */
function initTheme() {
  var saved = localStorage.getItem("friend_quiz_theme");
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var isDark = saved ? saved === "dark" : prefersDark;
  applyTheme(isDark);

  document.getElementById("theme-toggle").onclick = function() {
    var nowDark = !document.documentElement.classList.contains("dark");
    applyTheme(nowDark);
    localStorage.setItem("friend_quiz_theme", nowDark ? "dark" : "light");
    if (currentScreen === "result") {
      drawRadarChart(lastScores);
    }
  };
}

function applyTheme(isDark) {
  if (isDark) {
    document.documentElement.classList.add("dark");
    document.getElementById("theme-icon").textContent = "☀️";
  } else {
    document.documentElement.classList.remove("dark");
    document.getElementById("theme-icon").textContent = "🌙";
  }
}

/**
 * ฟังก์ชันสลับลำดับคำถามแบบสุ่ม (Fisher-Yates Shuffle)
 */
function shuffle(a) {
  a = a.slice();
  for (var j = a.length - 1; j > 0; j--) {
    var k = Math.floor(Math.random() * (j + 1));
    var t = a[j];
    a[j] = a[k];
    a[k] = t;
  }
  return a;
}

/**
 * แสดง Toast แจ้งเตือนสั้น ๆ
 */
var toastTimer = null;
function showToast(msg, icon) {
  var toast = document.getElementById("toast");
  document.getElementById("toast-msg").textContent = msg;
  document.getElementById("toast-icon").textContent = icon || "✨";
  toast.classList.remove("opacity-0", "translate-y-4");
  toast.classList.add("opacity-100", "translate-y-0");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    toast.classList.remove("opacity-100", "translate-y-0");
    toast.classList.add("opacity-0", "translate-y-4");
  }, 2600);
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/**
 * ฟังก์ชันวาดกรอบสี่เหลี่ยมมุมมนบน Canvas
 */
function roundRectPath(ctx, x, y, w, h, r) {
  var radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

/**
 * ฟังก์ชันตัดบรรทัดข้อความภาษาไทยและอังกฤษอัตโนมัติบน Canvas
 */
function wrapThaiText(ctx, text, maxWidth) {
  var words = [];
  if (typeof Intl !== "undefined" && Intl.Segmenter) {
    var segmenter = new Intl.Segmenter("th", { granularity: "word" });
    var segments = segmenter.segment(text);
    for (var seg of segments) {
      words.push(seg.segment);
    }
  } else {
    words = text.split("");
  }

  var lines = [];
  var currentLine = "";
  for (var n = 0; n < words.length; n++) {
    var testLine = currentLine + words[n];
    var metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && currentLine !== "") {
      lines.push(currentLine.trim());
      currentLine = words[n].trimStart();
    } else {
      currentLine = testLine;
    }
  }
  if (currentLine.trim() !== "") {
    lines.push(currentLine.trim());
  }
  return lines;
}

/**
 * วาดการ์ดที่ระลึกความละเอียดสูง (1080 x 1440 px) บน HTML5 Canvas
 */
function renderSouvenirCard() {
  var canvas = document.getElementById("souvenir-canvas");
  if (!canvas || !lastTops.length) return;
  var ctx = canvas.getContext("2d");
  var W = 1080;
  var H = 1440;
  canvas.width = W;
  canvas.height = H;

  var theme = CARD_THEMES[selectedCardTheme] || CARD_THEMES[0];
  var primaryIdx = lastTops[0];
  var t = T[primaryIdx];
  var isMulti = lastTops.length > 1;

  // 1. วาดพื้นหลังไล่สีตามธีมที่เลือก
  var bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, theme.bgGrad[0]);
  bgGrad.addColorStop(0.5, theme.bgGrad[1]);
  bgGrad.addColorStop(1, theme.bgGrad[2]);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 2. วาดวงกลมแสงฟุ้งตกแต่งมุมภาพ
  ctx.save();
  var glow1 = ctx.createRadialGradient(W - 120, 140, 20, W - 120, 140, 380);
  glow1.addColorStop(0, t.color + "38");
  glow1.addColorStop(1, t.color + "00");
  ctx.fillStyle = glow1;
  ctx.fillRect(0, 0, W, H);

  var glow2 = ctx.createRadialGradient(140, H - 180, 20, 140, H - 180, 360);
  glow2.addColorStop(0, theme.dot + "30");
  glow2.addColorStop(1, theme.dot + "00");
  ctx.fillStyle = glow2;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // 3. วาดการ์ดหลักตรงกลาง
  var cardX = 64;
  var cardY = 64;
  var cardW = W - 128;
  var cardH = H - 128;

  ctx.save();
  ctx.shadowColor = "rgba(20, 15, 30, 0.14)";
  ctx.shadowBlur = 45;
  ctx.shadowOffsetY = 18;
  roundRectPath(ctx, cardX, cardY, cardW, cardH, 52);
  ctx.fillStyle = theme.cardBg;
  ctx.fill();
  ctx.restore();

  // เส้นขอบการ์ดบาง ๆ
  roundRectPath(ctx, cardX, cardY, cardW, cardH, 52);
  ctx.strokeStyle = t.color + "45";
  ctx.lineWidth = 3;
  ctx.stroke();

  // แถบสีด้านบนของการ์ด
  ctx.save();
  roundRectPath(ctx, cardX, cardY, cardW, 22, 52);
  ctx.clip();
  ctx.fillStyle = t.color;
  ctx.fillRect(cardX, cardY, cardW, 22);
  ctx.restore();

  // 4. ส่วนหัวการ์ด: ป้ายชื่อผู้ใช้ & ชื่อแบบประเมิน
  var curY = cardY + 72;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  var headerLabel = userName
    ? "✨ การ์ดมิตรภาพของ " + userName + " ✨"
    : "✨ การ์ดที่ระลึก • ฉันเป็นเพื่อนแบบไหน? ✨";

  ctx.font = "600 26px 'Prompt', 'Anuphan', sans-serif";
  var badgeW = Math.min(ctx.measureText(headerLabel).width + 64, cardW - 100);
  roundRectPath(ctx, W / 2 - badgeW / 2, curY - 26, badgeW, 52, 26);
  ctx.fillStyle = t.color + "1c";
  ctx.fill();

  ctx.fillStyle = t.color;
  ctx.fillText(headerLabel, W / 2, curY);

  // 5. วงกลมไอคอนอิโมจิขนาดใหญ่
  curY += 118;
  ctx.beginPath();
  ctx.arc(W / 2, curY, 76, 0, Math.PI * 2);
  ctx.fillStyle = t.color + "18";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = t.color + "45";
  ctx.stroke();

  ctx.font = "86px sans-serif";
  ctx.fillText(t.e, W / 2, curY + 6);

  // 6. ชื่อประเภทเพื่อน + สโลแกน
  curY += 115;
  ctx.font = "700 54px 'Prompt', 'Anuphan', sans-serif";
  ctx.fillStyle = t.color;
  ctx.fillText(t.n, W / 2, curY);

  curY += 50;
  ctx.font = "600 30px 'Anuphan', sans-serif";
  ctx.fillStyle = theme.textMuted;
  var sloganText = "“" + t.s + "”";
  if (isMulti) {
    var otherNames = lastTops.slice(1).map(function(idx) { return T[idx].e + " " + T[idx].n.replace("เพื่อน", ""); }).join(", ");
    sloganText += " (ผสมผสานกับ " + otherNames + ")";
  }
  ctx.fillText(sloganText, W / 2, curY);

  // 7. คำอธิบายจุดเด่น
  curY += 54;
  ctx.font = "500 27px 'Anuphan', sans-serif";
  ctx.fillStyle = theme.textMain;
  var descLines = wrapThaiText(ctx, t.d, cardW - 140);
  descLines.forEach(function(line) {
    ctx.fillText(line, W / 2, curY);
    curY += 40;
  });

  // 8. ป้ายจุดเด่น (Tips Tags)
  curY += 16;
  ctx.font = "600 23px 'Anuphan', sans-serif";
  var tagGap = 16;
  var tagMetrics = t.tips.map(function(tip) {
    var txt = "✓ " + tip;
    return { text: txt, width: ctx.measureText(txt).width + 44 };
  });
  var totalTagsW = tagMetrics.reduce(function(acc, item) { return acc + item.width; }, 0) + tagGap * (tagMetrics.length - 1);
  var startTagX = W / 2 - totalTagsW / 2;

  tagMetrics.forEach(function(item) {
    roundRectPath(ctx, startTagX, curY - 23, item.width, 46, 23);
    ctx.fillStyle = t.color + "20";
    ctx.fill();
    ctx.fillStyle = t.color;
    ctx.fillText(item.text, startTagX + item.width / 2, curY);
    startTagX += item.width + tagGap;
  });

  // 9. กล่องข้อควรระวัง / คำแนะนำใจ
  curY += 56;
  var reminderBoxX = cardX + 56;
  var reminderBoxW = cardW - 112;
  var reminderBoxH = 74;
  roundRectPath(ctx, reminderBoxX, curY, reminderBoxW, reminderBoxH, 24);
  ctx.fillStyle = theme.isDark ? "rgba(245, 158, 11, 0.14)" : "#fffbeb";
  ctx.fill();
  ctx.strokeStyle = "rgba(245, 158, 11, 0.35)";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = "600 24px 'Anuphan', sans-serif";
  ctx.fillStyle = theme.isDark ? "#fcd34d" : "#b45309";
  ctx.fillText("💡 " + t.g, W / 2, curY + reminderBoxH / 2);

  // 10. ส่วนแสดงผลคะแนนทั้ง 6 มิติ (กราฟเรดาร์ด้านซ้าย + แถบคะแนนด้านขวา)
  curY += reminderBoxH + 30;
  var statsBoxX = cardX + 56;
  var statsBoxW = cardW - 112;
  var statsBoxH = 360;

  roundRectPath(ctx, statsBoxX, curY, statsBoxW, statsBoxH, 32);
  ctx.fillStyle = theme.boxBg;
  ctx.fill();
  ctx.strokeStyle = theme.isDark ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.06)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 10.1 วาด Mini Radar Chart ฝั่งซ้าย
  var radarCx = statsBoxX + 195;
  var radarCy = curY + statsBoxH / 2 + 8;
  var radarR = 105;
  var gridStroke = theme.isDark ? "rgba(255,255,255,0.16)" : "rgba(42,33,48,0.12)";

  for (var lv = 1; lv <= 5; lv++) {
    var rr = (radarR / 5) * lv;
    ctx.beginPath();
    for (var j = 0; j < 6; j++) {
      var ang = (Math.PI * 2 * j) / 6 - Math.PI / 2;
      var gx = radarCx + rr * Math.cos(ang);
      var gy = radarCy + rr * Math.sin(ang);
      if (j === 0) ctx.moveTo(gx, gy);
      else ctx.lineTo(gx, gy);
    }
    ctx.closePath();
    ctx.strokeStyle = gridStroke;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  for (var j = 0; j < 6; j++) {
    var ang = (Math.PI * 2 * j) / 6 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(radarCx, radarCy);
    ctx.lineTo(radarCx + radarR * Math.cos(ang), radarCy + radarR * Math.sin(ang));
    ctx.strokeStyle = gridStroke;
    ctx.stroke();
  }

  ctx.beginPath();
  for (var j = 0; j < 6; j++) {
    var scVal = Math.max(lastScores[j], 5);
    var pr = (scVal / 25) * radarR;
    var ang = (Math.PI * 2 * j) / 6 - Math.PI / 2;
    var px = radarCx + pr * Math.cos(ang);
    var py = radarCy + pr * Math.sin(ang);
    if (j === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = t.color + "44";
  ctx.fill();
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 3.5;
  ctx.stroke();

  ctx.font = "24px sans-serif";
  for (var j = 0; j < 6; j++) {
    var ang = (Math.PI * 2 * j) / 6 - Math.PI / 2;
    var lx = radarCx + (radarR + 28) * Math.cos(ang);
    var ly = radarCy + (radarR + 28) * Math.sin(ang);
    ctx.fillText(T[j].e, lx, ly);
  }

  // 10.2 วาดแถบคะแนนทั้ง 6 สายฝั่งขวา
  var barsStartX = statsBoxX + 380;
  var barsEndX = statsBoxX + statsBoxW - 36;
  var barWidth = barsEndX - barsStartX;
  var barRowY = curY + 42;
  var rowStep = 53;

  T.forEach(function(item, idx) {
    var scVal = lastScores[idx];
    var pct = scVal / 25;

    ctx.textAlign = "left";
    ctx.font = "600 21px 'Anuphan', sans-serif";
    ctx.fillStyle = theme.textMain;
    ctx.fillText(item.e + " " + item.n, barsStartX, barRowY);

    ctx.textAlign = "right";
    ctx.font = "700 21px 'Prompt', sans-serif";
    ctx.fillStyle = item.color;
    ctx.fillText(scVal + "/25", barsEndX, barRowY);

    // พื้นหลังหลอดคะแนน
    roundRectPath(ctx, barsStartX, barRowY + 14, barWidth, 12, 6);
    ctx.fillStyle = theme.isDark ? "rgba(255,255,255,0.12)" : "rgba(0,0,0,0.08)";
    ctx.fill();

    // เนื้อหลอดคะแนน
    var fillW = Math.max(12, barWidth * pct);
    roundRectPath(ctx, barsStartX, barRowY + 14, fillW, 12, 6);
    ctx.fillStyle = item.color;
    ctx.fill();

    barRowY += rowStep;
  });

  // 11. ป้าย "เพื่อนที่ฉันตามหา" (หากผู้ใช้กดเลือกไว้) และส่วนท้ายการ์ด
  var footerY = cardY + cardH - 52;
  ctx.textAlign = "center";

  if (want >= 0 && T[want]) {
    var wt = T[want];
    var wantLabel = "🔎 เพื่อนที่ฉันกำลังตามหา: " + wt.e + " " + wt.n + " (“" + wt.s + "”)";
    ctx.font = "600 23px 'Anuphan', sans-serif";
    var wBadgeW = Math.min(ctx.measureText(wantLabel).width + 52, cardW - 112);
    var wBadgeY = footerY - 62;
    roundRectPath(ctx, W / 2 - wBadgeW / 2, wBadgeY - 22, wBadgeW, 44, 22);
    ctx.fillStyle = wt.color + "22";
    ctx.fill();
    ctx.fillStyle = wt.color;
    ctx.fillText(wantLabel, W / 2, wBadgeY);
  }

  // วันที่และเครดิตด้านล่างสุดของการ์ด
  var todayStr = "";
  try {
    todayStr = new Date().toLocaleDateString("th-TH", {
      year: "numeric",
      month: "short",
      day: "numeric"
    });
  } catch (e) {}

  ctx.font = "500 20px 'Anuphan', sans-serif";
  ctx.fillStyle = theme.textMuted;
  ctx.fillText(
    "🫶 แบบประเมินมิตรภาพ 6 มิติ • ฉันเป็นเพื่อนแบบไหน?" + (todayStr ? " • " + todayStr : ""),
    W / 2,
    footerY
  );
}

/**
 * ฟังก์ชันคัดลอกข้อความลง Clipboard (รองรับ iframe)
 */
function copyToClipboard(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
  } catch (err) {}
  document.body.removeChild(ta);
}

/**
 * วาดกราฟเรดาร์ (Spider/Radar Chart) ด้วย HTML5 Canvas
 */
function drawRadarChart(scores) {
  var canvas = document.getElementById("radar-chart");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var dpr = window.devicePixelRatio || 1;
  var width = 300;
  var height = 280;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);

  var isDark = document.documentElement.classList.contains("dark");
  var gridColor = isDark ? "rgba(255, 255, 255, 0.14)" : "rgba(42, 33, 48, 0.12)";
  var textColor = isDark ? "#f6f2fa" : "#2a2130";

  var cx = width / 2;
  var cy = height / 2 + 4;
  var radius = 92;
  var total = 6;

  ctx.clearRect(0, 0, width, height);

  // วาดเส้นโครงข่าย 5 ระดับ
  for (var level = 1; level <= 5; level++) {
    var r = (radius / 5) * level;
    ctx.beginPath();
    for (var j = 0; j < total; j++) {
      var angle = (Math.PI * 2 * j) / total - Math.PI / 2;
      var x = cx + r * Math.cos(angle);
      var y = cy + r * Math.sin(angle);
      if (j === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // วาดแกนทั้ง 6 มุม
  for (var j = 0; j < total; j++) {
    var angle = (Math.PI * 2 * j) / total - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
    ctx.strokeStyle = gridColor;
    ctx.stroke();
  }

  // วาดพื้นที่คะแนนของผู้ใช้
  ctx.beginPath();
  for (var j = 0; j < total; j++) {
    var val = Math.max(scores[j], 5); // ขั้นต่ำ 5 จาก 25
    var r = (val / 25) * radius;
    var angle = (Math.PI * 2 * j) / total - Math.PI / 2;
    var x = cx + r * Math.cos(angle);
    var y = cy + r * Math.sin(angle);
    if (j === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = "rgba(255, 107, 66, 0.28)";
  ctx.fill();
  ctx.strokeStyle = "#ff6b42";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // วาดจุดยอดและป้ายกำกับแต่ละด้าน
  ctx.font = "600 12px 'Anuphan', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for (var j = 0; j < total; j++) {
    var val = Math.max(scores[j], 5);
    var r = (val / 25) * radius;
    var angle = (Math.PI * 2 * j) / total - Math.PI / 2;
    var px = cx + r * Math.cos(angle);
    var py = cy + r * Math.sin(angle);

    // จุดสีประจำสาย
    ctx.beginPath();
    ctx.arc(px, py, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = T[j].color;
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // ป้ายชื่อด้านนอก
    var labelRadius = radius + 28;
    var lx = cx + labelRadius * Math.cos(angle);
    var ly = cy + labelRadius * Math.sin(angle);
    ctx.fillStyle = textColor;
    var shortName = T[j].e + " " + T[j].n.replace("เพื่อนสาย", "");
    ctx.fillText(shortName, lx, ly);
  }
}

/**
 * เอฟเฟกต์ Confetti ฉลองผลลัพธ์
 */
function launchConfetti() {
  var canvas = document.getElementById("confetti-canvas");
  if (!canvas) return;
  canvas.classList.remove("hidden");
  var ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  var colors = ["#ff6b42", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899"];
  var pieces = [];
  for (var p = 0; p < 55; p++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height * 0.5,
      w: 7 + Math.random() * 6,
      h: 10 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: 2.5 + Math.random() * 3.5,
      vx: -1.5 + Math.random() * 3,
      rot: Math.random() * Math.PI * 2,
      vrot: -0.08 + Math.random() * 0.16
    });
  }

  var frame = 0;
  function tick() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var active = false;
    pieces.forEach(function(it) {
      it.x += it.vx;
      it.y += it.vy;
      it.rot += it.vrot;
      if (it.y < canvas.height + 20) active = true;

      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rot);
      ctx.fillStyle = it.color;
      ctx.fillRect(-it.w / 2, -it.h / 2, it.w, it.h);
      ctx.restore();
    });

    if (active && frame < 180) {
      requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.classList.add("hidden");
    }
  }
  requestAnimationFrame(tick);
}
